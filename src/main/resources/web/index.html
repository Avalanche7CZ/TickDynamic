<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TickDynamic Dashboard</title>
  <style>
    :root { --bg:#0f1115; --panel:#161a22; --text:#e6e7ea; --muted:#a9acb3; --accent:#4cc9f0; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; }
    html,body { height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif; margin:0; }
    header { padding:16px 20px; background:#0c0f14; border-bottom:1px solid #1f2633; display:flex; align-items:center; gap:16px; }
    header h1 { margin:0; font-size:18px; letter-spacing:.2px; }
    header .sub { color:var(--muted); font-size:12px; }
    main { padding:20px; display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
    /* Responsive fallback for smaller screens */
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    .card { background:var(--panel); border:1px solid #232a36; border-radius:10px; overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.25); }
    .card header { background:transparent; border:0; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .card header .title { display:flex; flex-direction:column; gap:4px; }
    .card header .title .small { color:var(--muted); font-size:12px; }
    .toggle { appearance:none; background:#11151d; color:var(--text); border:1px solid #1d2431; border-radius:8px; padding:6px 10px; cursor:pointer; line-height:1; font-size:12px; }
    .toggle:hover { border-color:#2a3343; }
    .card.collapsed .grid-col { display:none; }

    /* KPIs: exactly 3 columns, larger boxes */
    .kvs { display:grid; gap:18px; padding:0 16px 16px; grid-template-columns:repeat(3, minmax(260px, 1fr)); }
    .kv { background:#11151d; border:1px solid #1d2431; border-radius:10px; padding:16px 18px; min-width:0; }
    .kv .label { color:var(--muted); font-size:14px; letter-spacing:.2px; }
    .kv .value { font-size:22px; margin-top:6px; }

    .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid transparent; }
    .pill.ok { background:rgba(46,204,113,.1); color:var(--ok); border-color:rgba(46,204,113,.25); }
    .pill.warn { background:rgba(241,196,15,.1); color:var(--warn); border-color:rgba(241,196,15,.25); }
    .pill.bad { background:rgba(231,76,60,.1); color:var(--bad); border-color:rgba(231,76,60,.25); }
    .pill.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px 10px; border-top:1px solid #232a36; text-align:left; }
    th { color:var(--muted); font-weight:600; font-size:12px; background:#121620; position:sticky; top:0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .table-wrap { overflow:auto; max-width:100%; }

    /* Responsive column hiding for readability */
    @media (max-width: 1200px) { .col-last, .col-runAvg { display:none; } }
    @media (max-width: 980px) { .col-slice, .col-min, .col-tdlimit { display:none; } }

    .footer { color:var(--muted); padding:8px 20px 20px; font-size:12px; }
    .grid-col { display:flex; flex-direction:column; gap:10px; padding:0 16px 16px; }
    .small { font-size:12px; color:var(--muted); }
    .row { display:flex; gap:10px; align-items:center; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }

    .hotspots { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
    .hotspot { background:#11151d; border:1px solid #1d2431; border-radius:8px; padding:10px 12px; }
    .hotspot h4 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; }
    .hotspot ul { list-style:none; margin:0; padding:0; }
    .hotspot li { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px dashed #232a36; }
    .hotspot li:first-child { border-top:0; }

    /* --- TPS/ms graph --- */
    #tps-graph { width:100%; max-width:700px; height:120px; margin:0 auto 18px; background:rgba(30,34,44,0.7); border-radius:10px; }
    /* --- Server summary card --- */
    #server-summary { max-width:700px; margin:18px auto; }
  </style>
</head>
<body>
    <header>
      <h1>TickDynamic Dashboard</h1>
      <div class="sub" id="version"></div>
      <div class="sub" id="status"></div>
      <div class="sub" id="lastUpdate"></div>
    </header>
    <div id="server-summary"></div>
    <div id="tps-graph-wrap"><canvas id="tps-graph" width="600" height="120" style="width:100%;max-width:700px;display:block;margin:0 auto 18px;background:rgba(30,34,44,0.7);border-radius:10px;"></canvas></div>
    <main id="content"></main>
    <div class="footer">Auto-refreshing every <span id="interval">1000</span> ms — <a href="#" id="toggle">Pause</a> · Refresh: <select id="refreshSel"><option value="1000">1s</option><option value="2000">2s</option><option value="5000" selected>5s</option><option value="10000">10s</option><option value="30000">30s</option></select> · <label><input type="checkbox" id="smartUpdate" checked> Smart updates</label></div>
    <script>
    const content = document.getElementById('content');
    const version = document.getElementById('version');
    const status = document.getElementById('status');
    const intervalLbl = document.getElementById('interval');
    const lastUpdate = document.getElementById('lastUpdate');
    const toggle = document.getElementById('toggle');
    const refreshSel = document.getElementById('refreshSel');
    const smartUpdate = document.getElementById('smartUpdate');

    let running = true;
    let period = 5000;
    let lastHtml = '';
    let lastData = null;
    let timerId = null;
    const openMbg = new Set();
    const closedMbg = new Set();

    function startPolling(){ if(timerId==null){ timerId = setInterval(poll, period); } }
    function stopPolling(){ if(timerId!=null){ clearInterval(timerId); timerId=null; } }

    document.addEventListener('visibilitychange', () => {
      if(document.hidden) { stopPolling(); }
      else { if(running) startPolling(); }
    });

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      running = !running;
      toggle.textContent = running ? 'Pause' : 'Resume';
      if(running) { startPolling(); poll(); }
      else { stopPolling(); }
    });

    // Live refresh selector wiring
    refreshSel.addEventListener('change', () => {
      const v = parseInt(refreshSel.value, 10);
      if(!isNaN(v) && v > 0) {
        period = v;
        intervalLbl.textContent = v;
        if(running) { stopPolling(); startPolling(); }
      }
    });

    function pill(cls, text){ return `<span class="pill ${cls}">${text}</span>`; }
    function fmtMs(x){ return (x||0).toFixed(2)+' ms'; }
    function fmtMs2(x){
      const v = +x||0;
      if(v <= 0) return '0.00 ms';
      if(v < 0.001) return '<0.001 ms'; // Show very small values more clearly
      if(v < 0.01) return v.toFixed(3)+' ms'; // 3 decimal places for small values
      if(v < 1.0) return v.toFixed(2)+' ms'; // 2 decimal places for normal values
      return v.toFixed(1)+' ms'; // 1 decimal place for larger values
    }
    function fmtNum(x){ return (x==null?0:x).toLocaleString(); }
    function fmtPct(x){ return (x==null?0:x).toFixed(0)+'%'; }
    function nsToMs(x){
      const ns = +x||0;
      if(ns <= 0) return 0;
      return ns / 1000000.0; // Convert nanoseconds to milliseconds
    }

    function colorForPct(p){ if(p<70) return 'ok'; if(p<90) return 'warn'; return 'bad'; }
    function colorForSpeed(p){ if(p>=95) return 'ok'; if(p>=70) return 'warn'; return 'bad'; }

    // Fast comparison for data changes
    function dataChanged(newData, oldData) {
      if (!oldData) return true;

      // Quick header checks
      if (newData.averageTPS !== oldData.averageTPS ||
          newData.lastTickMs !== oldData.lastTickMs ||
          newData.dynamicActive !== oldData.dynamicActive) return true;

      // Check world count
      const newWorlds = newData.worlds || [];
      const oldWorlds = oldData.worlds || [];
      if (newWorlds.length !== oldWorlds.length) return true;

      // Check world data
      for (let i = 0; i < newWorlds.length; i++) {
        const nw = newWorlds[i];
        const ow = oldWorlds[i];
        if (!ow || nw.dimId !== ow.dimId) return true;

        // Check key world metrics
        if (nw.loadedEntities !== ow.loadedEntities ||
            nw.loadedTileEntities !== ow.loadedTileEntities ||
            nw.worldSpeedPercent !== ow.worldSpeedPercent) return true;

        // Check groups length
        const ng = nw.groups || [];
        const og = ow.groups || [];
        if (ng.length !== og.length) return true;

        // Quick group check
        for (let j = 0; j < ng.length; j++) {
          if (!og[j] || ng[j].count !== og[j].count || ng[j].speedPercent !== og[j].speedPercent) return true;
        }
      }

      return false;
    }

    // Update only header elements that change frequently
    function updateHeader(data) {
      version.textContent = 'v'+(data.version||'');
      const tps = data.averageTPS || 0;
      const ms = data.lastTickMs || 0;
      const budget = data.defaultTickMs || 50;
      const active = !!data.dynamicActive;
      const pctRaw = (ms/(budget||50))*100;
      const pctColor = Math.min(100, Math.max(0, pctRaw));

      status.innerHTML = `${pill(colorForPct(pctColor), `${fmtMs(ms)} (${fmtPct(pctRaw)})`)} · TPS ${tps.toFixed(2)} · ${active?pill('ok','TD active'):pill('warn','TD inactive')}`;
    }

    // Render per-world group table (entities/tileentities)
    function renderGroupTable(world) {
      const groups = Array.isArray(world.groups) ? world.groups : [];
      if (!groups.length) return '';
      const dim = world.dimId;
      let html = `<div class="table-wrap"><table><thead><tr>`+
        `<th>Name</th><th>Type</th><th>Count</th><th class="col-slice">SliceMax</th>`+
        `<th>Time Max</th><th>Time Avg</th><th class="col-last">Time Last</th><th class="col-runAvg">Run Avg</th>`+
        `<th>Speed</th><th class="col-tdlimit">TD</th>`+
        `</tr></thead><tbody data-groups-for="${dim}">`;
      groups.forEach(g => {
        const t = g.timing || {};
        const type = (g.type === 'tileentity' || g.type === 'tileEntity') ? 'TileEntity' : 'Entity';
        const speed = (g.speedPercent != null) ? g.speedPercent : (t.avgTPS != null ? Math.min(100, Math.max(0, (t.avgTPS/20)*100)) : 100);
        const speedPill = pill(colorForSpeed(speed), fmtPct(speed));
        const tdPill = g.tdLimited ? pill('bad', 'Limited') : pill('ok', '—');
        html += `<tr>`+
          `<td>${g.name||''}</td>`+
          `<td>${type}</td>`+
          `<td>${fmtNum(g.count||0)}</td>`+
          `<td class="col-slice mono">${t.sliceMax!=null?fmtNum(t.sliceMax):fmtNum(g.slicesMax||0)}</td>`+
          `<td class="mono">${fmtMs2(t.maxMs||0)}</td>`+
          `<td class="mono">${fmtMs2(t.avgMs||0)}</td>`+
          `<td class="col-last mono">${fmtMs2(t.lastMs||0)}</td>`+
          `<td class="col-runAvg mono">${fmtNum(t.runAvg||0)}</td>`+
          `<td>${speedPill}</td>`+
          `<td class="col-tdlimit">${tdPill}</td>`+
        `</tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    // Update specific world sections without full rebuild
    function updateWorldData(worldElement, worldData) {
      // Update KPIs
      const kvs = worldElement.querySelectorAll('.kv .value');
      if (kvs.length >= 3) {
        const eLoaded = worldData.loadedEntities != null ? worldData.loadedEntities : worldData.totalEntities;
        const teLoaded = worldData.loadedTileEntities != null ? worldData.loadedTileEntities : worldData.totalTileEntities;
        const wSpeed = (worldData.worldSpeedPercent != null ? worldData.worldSpeedPercent : (worldData.speedPercent != null ? worldData.speedPercent : 100));

        kvs[0].textContent = fmtNum(eLoaded);
        kvs[1].textContent = fmtNum(teLoaded);
        kvs[2].innerHTML = pill(colorForSpeed(wSpeed), fmtPct(wSpeed));
      }

      // Update group table rows (target the right tbody)
      const tbody = worldElement.querySelector(`tbody[data-groups-for="${worldData.dimId}"]`);
      if (tbody && Array.isArray(worldData.groups)) {
        const rows = tbody.querySelectorAll('tr');
        worldData.groups.forEach((g, i) => {
          if (rows[i]) {
            const cells = rows[i].querySelectorAll('td');
            if (cells.length >= 10) {
              const t = g.timing || {};
              const speed = (g.speedPercent != null) ? g.speedPercent : (t.avgTPS != null ? Math.min(100, Math.max(0, (t.avgTPS/20)*100)) : 100);
              cells[2].textContent = fmtNum(g.count||0); // Count
              cells[3].textContent = (t.sliceMax!=null?fmtNum(t.sliceMax):fmtNum(g.slicesMax||0)); // SliceMax
              cells[4].textContent = fmtMs2(t.maxMs||0); // Time Max
              cells[5].textContent = fmtMs2(t.avgMs||0); // Time Avg
              cells[6].textContent = fmtMs2(t.lastMs||0); // Time Last
              cells[7].textContent = fmtNum(t.runAvg||0); // Run Avg
              cells[8].innerHTML = pill(colorForSpeed(speed), fmtPct(speed)); // Speed
              cells[9].innerHTML = g.tdLimited ? pill('bad','Limited') : pill('ok','—'); // TD
            }
          }
        });
      }
    }

    // --- TPS/ms graph state ---
    const tpsHistory = [];
    const msHistory = [];
    const maxHistory = 60;
    function pushHistory(tps, ms) {
      if (tpsHistory.length >= maxHistory) tpsHistory.shift();
      if (msHistory.length >= maxHistory) msHistory.shift();
      tpsHistory.push(tps);
      msHistory.push(ms);
    }
    function drawGraph() {
      const canvas = document.getElementById('tps-graph');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // Draw ms (red) and TPS (blue) lines
      const w = canvas.width, h = canvas.height;
      ctx.save();
      // ms line (red, semi-transparent)
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(231,76,60,0.5)';
      ctx.lineWidth = 2;
      for(let i=0;i<msHistory.length;i++){
        const x = i/(maxHistory-1)*w;
        const y = h - (Math.min(100, msHistory[i])/100)*h;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // TPS line (blue, semi-transparent)
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(76,201,240,0.5)';
      ctx.lineWidth = 2;
      for(let i=0;i<tpsHistory.length;i++){
        const x = i/(maxHistory-1)*w;
        const y = h - (Math.min(20, tpsHistory[i])/20)*h;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // Axis labels
      ctx.fillStyle = '#a9acb3';
      ctx.font = '12px sans-serif';
      ctx.fillText('TPS', 10, 16);
      ctx.fillText('ms', 10, h-8);
      ctx.restore();
    }
    // --- Server summary card ---
    function renderServerSummary(data) {
      const el = document.getElementById('server-summary');
      if (!el) return;
      const tps = data.averageTPS || 0;
      const ms = data.lastTickMs || 0;
      const ent = data.totalLoadedEntities || 0;
      const te = data.totalLoadedTileEntities || 0;
      const c2 = data.c2me || {};
      const c2en = !!c2.enabled;
      const c2min = ((c2.minTps||0)/100);
      const c2line = `<div class=\"row small\" style=\"margin-top:8px;\">`+
        `${c2en?pill('ok','C2ME Prefetch ON'):pill('bad','C2ME OFF')} · `+
        `R=${c2.radius||0} · perTick=${c2.perTick||0} · minTPS=${c2min.toFixed(2)} · last=${c2.lastPrefetch||0} · total=${(c2.totalPrefetched||0)}${c2.attemptSetSize!=null?` · attempts=${c2.attemptSetSize}`:''}`+
        `</div>`;
      el.innerHTML = `<div class="card" style="margin:18px auto 18px;max-width:700px;background:rgba(22,26,34,0.85);box-shadow:0 2px 8px #0002;">
        <header><div class="title"><div class="row"><strong>Server Summary</strong></div></div></header>
        <div class="grid-col" style="gap:0;">
          <div class="kvs" style="grid-template-columns:repeat(4,1fr);">
            <div class="kv"><div class="label">TPS</div><div class="value mono">${tps.toFixed(2)}</div></div>
            <div class="kv"><div class="label">Tick Time</div><div class="value mono">${fmtMs2(ms)}</div></div>
            <div class="kv"><div class="label">Entities</div><div class="value mono">${fmtNum(ent)}</div></div>
            <div class="kv"><div class="label">TileEntities</div><div class="value mono">${fmtNum(te)}</div></div>
          </div>
          ${c2 && (c2.enabled!=null) ? c2line : ''}
        </div>
      </div>`;
    }
    // --- Mini summary by category prefix ---
    function renderTileCategorySummary(world) {
      const arr = world.tileCategorySummary||[];
      if (!arr.length) return '';
      let html = '<div class="tile-cat-summary" style="display:flex;flex-wrap:wrap;gap:8px 12px;margin:8px 0 10px 0;">';
      arr.forEach(cat => {
        html += `<span class="pill mono" style="background:rgba(76,201,240,0.08);color:#4cc9f0;border:1px solid #2a3343;min-width:90px;">${cat.prefix}: <b>${fmtNum(cat.count)}</b> · ${fmtMs2(cat.ms)}</span>`;
      });
      html += '</div>';
      return html;
    }
    // --- Sorting toggles for Tile Entities list ---
    let tileSortKey = 'count';
    let tileSortDir = -1;
    function renderTileSortToggles() {
      return `<div class="small" style="margin-bottom:4px;display:flex;align-items:center;gap:10px;">
        <span>Sort by:</span>
        <button type="button" class="toggle" id="sortByCount">Count${tileSortKey==='count'?(tileSortDir>0?' ↑':' ↓'):''}</button>
        <button type="button" class="toggle" id="sortByMs">Ms${tileSortKey==='ms'?(tileSortDir>0?' ↑':' ↓'):''}</button>
      </div>`;
    }
    function sortTileSummary(arr) {
      if (!Array.isArray(arr)) return arr;
      return arr.slice().sort((a,b)=>{
        if(tileSortKey==='ms') return tileSortDir*(b.ms-a.ms);
        return tileSortDir*(b.count-a.count);
      });
    }

    function render(data){
      const useSmartUpdate = smartUpdate.checked;

      // Always update header and server summary (lightweight)
      updateHeader(data);
      renderServerSummary(data);
      pushHistory(data.averageTPS||0, data.lastTickMs||0);
      drawGraph();

      // Check if we need full render or can do smart update
      if (useSmartUpdate && lastData && !dataChanged(data, lastData)) {
        // Do smart update - only update changing numbers
        const worlds = data.worlds || [];
        worlds.forEach((worldData, index) => {
          const worldElement = document.querySelector(`[data-dim="${worldData.dimId}"]`);
          if (worldElement) {
            updateWorldData(worldElement, worldData);
          }
        });
        return; // Skip full render
      }

      // Full render only when necessary
      const worlds = data.worlds||[];
      const allLagTiles = [];
      const allLagChunks = [];
      const typeAgg = new Map(); // name -> totalMs
      const minHs = +data.minHotspotMs || 0; // ms threshold for hotspots

      // Aggregate server-wide hotspots by time (only worlds with players and not special)
      worlds.forEach(w => {
        const p = (w.players||0);
        if(p <= 0) return; if(w.special) return;
        (w.lagTopTiles||[]).forEach(t => {
          const tm = +t.totalMs||0; if(tm < minHs) return;
          allLagTiles.push({ name:t.name, x:t.x, y:t.y, z:t.z, totalMs: tm, dim:w.dimId });
          const key = t.name||'unknown';
          typeAgg.set(key, (typeAgg.get(key)||0) + tm);
        });
        (w.lagTopChunksTime||[]).forEach(c => {
          const tm = +c.totalMs||0; if(tm < minHs) return;
          allLagChunks.push({ cx:c.cx, cz:c.cz, totalMs:tm, dim:w.dimId });
        });
      });
      allLagTiles.sort((a,b)=>b.totalMs-a.totalMs);
      allLagChunks.sort((a,b)=>b.totalMs-a.totalMs);
      const topTilesServer = allLagTiles.slice(0,10);
      const topChunksServer = allLagChunks.slice(0,10);
      const topTypes = Array.from(typeAgg.entries()).map(([name,totalMs])=>({name,totalMs})).sort((a,b)=>b.totalMs-a.totalMs).slice(0,10);

      // Build content (world cards only)
      let html = '';

      // Optional: show server hotspots card within content area if any
      if(topTilesServer.length || topChunksServer.length || topTypes.length){
        html += `<section class="card"><header><div class="title"><div class="row"><strong>Server Hotspots</strong></div><div class="row small">Worlds with players (non-special). Time entries ≥ ${minHs.toFixed(2)} ms</div></div></header>`;
        html += `<div class="grid-col"><div class="hotspots">`;
        if(topTilesServer.length){
          html += `<div class="hotspot"><h4>Top TileEntities (instances by time)</h4><ul>`;
          topTilesServer.forEach(t=>{ html += `<li><span>${t.name||''} @ DIM ${t.dim} ${t.x},${t.y},${t.z}</span><span class="mono">${fmtMs2(t.totalMs)}</span></li>`; });
          html += `</ul></div>`;
        }
        if(topChunksServer.length){
          html += `<div class="hotspot"><h4>Top Chunks (by time)</h4><ul>`;
          topChunksServer.forEach(c=>{ html += `<li><span>DIM ${c.dim} (${c.cx}, ${c.cz})</span><span class="mono">${fmtMs2(c.totalMs)}</span></li>`; });
          html += `</ul></div>`;
        }
        if(topTypes.length){
          html += `<div class="hotspot"><h4>Intensive Tile types (by time)</h4><ul>`;
          topTypes.forEach(t=>{ html += `<li><span>${t.name||''}</span><span class="mono">${fmtMs2(t.totalMs)}</span></li>`; });
          html += `</ul></div>`;
        }
        html += `</div></div></section>`;
      }

      // Show all worlds, even if empty
      (data.worlds||[]).forEach((w, worldIdx) => {
        const wSpeed = (w.worldSpeedPercent!=null ? w.worldSpeedPercent : (w.speedPercent!=null ? w.speedPercent : 100));
        const wActive = !!w.tdActive;
        const eLoaded = w.loadedEntities!=null ? w.loadedEntities : w.totalEntities;
        const teLoaded = w.loadedTileEntities!=null ? w.loadedTileEntities : w.totalTileEntities;
        const penNote = (w.penalizedSkipped ? ` · <span class=\"small\" title=\"penalized list skipped: TE ${fmtNum(teLoaded)} > ${fmtNum(w.penalizedScanMax||0)}\">penalized list skipped</span>` : '');
        html += `<section class=\"card\" data-dim=\"${w.dimId}\">\n<header>\n  <div class=\"title\"><div class=\"row\"><strong>World:</strong>&nbsp;${w.name||''} (DIM ${w.dimId}) ${wActive?pill('ok','TD on'):pill('warn','TD off')}</div>\n  <div class=\"row small\">Entities: ${fmtNum(eLoaded)} · TileEntities: ${fmtNum(teLoaded)}${w.special?` · ${pill('warn','special')}`:''}${penNote}</div></div>\n  <button class=\"toggle\" aria-expanded=\"true\" title=\"Collapse/Expand\">▾</button>\n</header>`;
        html += `<div class=\"grid-col\">`;
        html += `<div class=\"kvs\">\n  <div class=\"kv\"><div class=\"label\">Loaded Entities</div><div class=\"value mono\">${fmtNum(eLoaded)}</div></div>\n  <div class=\"kv\"><div class=\"label\">Loaded TileEntities</div><div class=\"value mono\">${fmtNum(teLoaded)}</div></div>\n  <div class=\"kv\"><div class=\"label\">Speed</div><div class=\"value\">${pill(colorForSpeed(wSpeed), fmtPct(wSpeed))}</div></div>\n</div>`;

        // Group table (entities + tileentities)
        html += renderGroupTable(w);

        // Per-world TileEntity hotspots: by count and by time (intensity)
        const ts = w.tileSummary||null;
        const lt = (w.lagTopTileTypes||[]);
        const lagTiles = (w.lagTopTiles||[]);
        const topChunks = (w.lagTopChunksTime||[]);
        if(teLoaded > 0) {
          html += `<div class=\"hotspots\">`;
          if(ts && ts.length > 0){
            html += `<div class="hotspot"><h4>Tile Entities (by count)</h4><ul class="tileSummaryList">`;
            ts.forEach(s=>{
              const label = (s.display && s.display.trim()) ? s.display : (s.name||'unknown');
              const mod = s.modName || s.modId || '';
              const modDisplay = mod ? ` <span class="small">(${mod})</span>` : '';
              const isMb = s.multiblock;
              const mbType = s.multiblockType||'';
              const msVal = +s.ms || 0;
              const right = (msVal>0 ? `${fmtMs2(msVal)} · ` : '') + `${fmtNum(s.count)}`;
              html += `<li class="${isMb?'multiblock-tile':''}"><span>${label}${modDisplay}${isMb?` <span title="${mbType}" style="color:#4cc9f0;font-weight:bold;">[MB]</span>`:''}</span><span class="mono">${right}</span></li>`;
            });
            html += `</ul></div>`;
          } else {
            html += `<div class=\"hotspot\"><h4>Tile Entities (by count)</h4>`;
            html += `<div class=\"small\" style=\"opacity:0.7; padding:8px 0;\">`;
            html += `Tile summary not available (${fmtNum(teLoaded)} TEs loaded).<br>`;
            html += `This may indicate TickDynamic tile management is disabled or no tile groups are active.`;
            html += `</div></div>`;
          }

          if(lt && lt.length > 0){
            html += `<div class=\"hotspot\"><h4>Tile Entities (by intensity)</h4><ul>`;
            lt.forEach(t=>{
              const hits = +t.hits||0;
              const total = +t.totalMs||0;
              const avg = hits > 0 ? (total/hits) : 0;
              const hitsInfo = hits > 0 ? ` <span class=\"small\">(${hits} hits)</span>` : '';
              const avgInfo = hits > 0 ? ` · ${fmtMs2(avg)}/hit` : '';
              html += `<li><span>${t.name||'unknown'}${hitsInfo}</span><span class=\"mono\">${fmtMs2(total)}${avgInfo}</span></li>`;
            });
            html += `</ul></div>`;
          }

          if(lagTiles && lagTiles.length > 0){
            html += `<div class=\"hotspot\"><h4>Lagging Tile Entities (instances)</h4><ul>`;
            lagTiles.forEach(t=>{
              const name = t.name || 'unknown';
              const coords = `${t.x},${t.y},${t.z}`;
              html += `<li><span>${name} @ ${coords}</span><span class=\"mono\">${fmtMs2(t.totalMs)}</span></li>`;
            });
            html += `</ul></div>`;
          }

          if(topChunks && topChunks.length > 0){
            html += `<div class=\"hotspot\"><h4>Top Chunks (by time)</h4><ul>`;
            topChunks.forEach(c=>{
              const chunkName = `Chunk (${c.cx}, ${c.cz})`;
              html += `<li><span>${chunkName}</span><span class=\"mono\">${fmtMs2(c.totalMs)}</span></li>`;
            });
            html += `</ul></div>`;
          }

          html += `</div>`;
        } else {
          html += `<div class=\"small\" style=\"opacity:0.7; padding:0 16px;\">No tile entities loaded in this world.</div>`;
        }

        // Multiblock section replaced: render only grouped multiblocks
        html += renderMultiblockGroups(w, worldIdx);
        html += `</div></section>`;
      });

      if(html !== lastHtml) {
        content.innerHTML = html || '<div class="small" style="opacity:.7">No worlds loaded.</div>';
        lastHtml = html;
        document.querySelectorAll('.card > header > .toggle').forEach(btn => {
          btn.addEventListener('click', () => {
            const card = btn.closest('.card');
            const nowOpen = card.classList.toggle('collapsed') ? false : true;
            btn.setAttribute('aria-expanded', nowOpen);
            btn.textContent = nowOpen ? '▾' : '▸';
          });
        });
        // Bind grouped multiblock show/hide buttons on fresh DOM, persist state across renders
        document.querySelectorAll('button[data-mbgk]').forEach(btn => {
          btn.onclick = function() {
            const keyRaw = btn.getAttribute('data-mbgk');
            const rowId = btn.getAttribute('data-target');
            const row = document.getElementById(rowId);
            if(row) {
              const currentlyOpen = !(row.style.display === 'none');
              if(currentlyOpen) {
                row.style.display = 'none';
                btn.textContent = 'Show';
                openMbg.delete(keyRaw);
                closedMbg.add(keyRaw);
              } else {
                row.style.display = 'table-row';
                btn.textContent = 'Hide';
                openMbg.add(keyRaw);
                closedMbg.delete(keyRaw);
              }
            }
          };
        });
      }

      lastData = JSON.parse(JSON.stringify(data));
    }

    async function poll(){
      if(!running) return;
      try{
        const r = await fetch('api/metrics', { cache:'no-store' });
        if(!r.ok) throw new Error('HTTP '+r.status);
        const data = await r.json();
        render(data);
        lastUpdate.textContent = 'Last update: '+new Date().toLocaleTimeString();
      }catch(e){
        lastUpdate.textContent = 'Error: '+e.message;
      }
    }

    // Initialize footer values
    intervalLbl.textContent = period;
    refreshSel.value = String(period);
    startPolling();
    poll();
    // Attach sorting event listeners after render
    setTimeout(()=>{
      const btnCount = document.getElementById('sortByCount');
      const btnMs = document.getElementById('sortByMs');
      if(btnCount) btnCount.onclick = ()=>{ tileSortKey='count'; tileSortDir*=-1; poll(); };
      if(btnMs) btnMs.onclick = ()=>{ tileSortKey='ms'; tileSortDir*=-1; poll(); };
    },0);
    // Attach dropdown event listeners for grouped multiblocks
    setTimeout(()=>{
      document.querySelectorAll('button[data-mbgk]').forEach(btn => {
        btn.onclick = function() {
          const keyRaw = btn.getAttribute('data-mbgk');
          const rowId = btn.getAttribute('data-target');
          const row = document.getElementById(rowId);
          if(row) {
            const currentlyOpen = !(row.style.display === 'none');
            if(currentlyOpen) {
              row.style.display = 'none'; btn.textContent = 'Show'; openMbg.delete(keyRaw); closedMbg.add(keyRaw);
            } else {
              row.style.display = 'table-row'; btn.textContent = 'Hide'; openMbg.add(keyRaw); closedMbg.delete(keyRaw);
            }
          }
        };
      });
    },0);

    function renderMultiblockGroups(world, worldIdx) {
      // Build or use provided groups
      let groups = world.multiblockGroups || [];
      if (!groups.length) {
        const mbs = Array.isArray(world.multiblocks) ? world.multiblocks : [];
        if (mbs.length) {
          const map = new Map();
          mbs.forEach(mb => {
            const type = mb.type || '';
            const name = mb.displayName || '';
            const key = type + '|' + name;
            if (!map.has(key)) map.set(key, { type, displayName: name, instances: [] });
            const inst = {
              x: mb.controller && mb.controller.x != null ? mb.controller.x : undefined,
              y: mb.controller && mb.controller.y != null ? mb.controller.y : undefined,
              z: mb.controller && mb.controller.z != null ? mb.controller.z : undefined,
              active: !!mb.active,
              size: mb.size || 0,
              totalMs: mb.totalMs || 0,
              avgMs: mb.avgMs || 0,
              hits: mb.hits || 0,
              penalized: !!mb.penalized,
              prob: mb.prob || 0
            };
            map.get(key).instances.push(inst);
          });
          groups = Array.from(map.values()).map(g => ({
            type: g.type,
            displayName: g.displayName,
            count: g.instances.length,
            instances: g.instances
          }));
        }
      }
      if (!groups.length) return '';
      const dim = world.dimId;
      const single = groups.length === 1;
      const encodeKey = k => encodeURIComponent(k);
      let html = `<div class="hotspots"><div class="hotspot"><h4>Grouped Multiblocks</h4><div class="table-wrap"><table><thead><tr><th>Type</th><th>Name</th><th>Count</th><th>Instances</th></tr></thead><tbody>`;
      groups.forEach((grp, i) => {
        const type = grp.type || '';
        const name = grp.displayName || '';
        const count = grp.count || (grp.instances ? grp.instances.length : 0) || 0;
        const keyRaw = `${dim}|${type}|${name}`;
        const key = encodeKey(keyRaw);
        const rowId = `mbg-row-${key}`;
        const userClosed = closedMbg.has(keyRaw);
        const userOpen = openMbg.has(keyRaw);
        const isOpen = userOpen || (single && !userClosed);
        html += `<tr><td>${type}</td><td>${name}</td><td>${count}</td><td>`;
        const hasInstances = grp.instances && grp.instances.length;
        if (hasInstances) {
          const btnLabel = isOpen ? 'Hide' : 'Show';
          html += `<button class="toggle" data-mbgk="${keyRaw}" data-target="${rowId}">${btnLabel}</button>`;
          html += `</td></tr>`;
          const displayStyle = isOpen ? '' : 'display:none;';
          html += `<tr id="${rowId}" style="${displayStyle}"><td colspan="4"><ul style="margin:0;padding-left:1em;">`;
          grp.instances.forEach(inst => {
            const hasCtrl = inst.x != null && inst.y != null && inst.z != null;
            const ctrl = hasCtrl ? `${inst.x},${inst.y},${inst.z}` : '';
            const active = inst.active ? '<span class="pill ok">Yes</span>' : '<span class="pill bad">No</span>';
            html += `<li>Controller: ${ctrl} · Active: ${active} · Size: ${inst.size||0} · TotalMs: ${fmtMs2(inst.totalMs||0)} · AvgMs: ${fmtMs2(inst.avgMs||0)}${inst.penalized?` · <span class='pill bad'>TD Limited</span>`:''}</li>`;
          });
          html += `</ul></td></tr>`;
        } else {
          html += `</td></tr>`;
        }
      });
      html += `</tbody></table></div></div></div>`;
      return html;
    }
    </script>
  </body>
</html>
